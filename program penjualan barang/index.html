<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta id="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Penjualan Barang</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form>
        <h1>PROGRAM PENJUALAN BARANG</h1>
        <table>
            <tr>
                <td>Nama Barang</td>
                <td>:</td>
                <td>
                    <select name="barang" id="pilihBarang">
                        <option disabled selected hidden>-- Pilih Barang --</option>
                        <option value="Sapu">Sapu</option>
                        <option value="Sabun">Sabun</option>
                        <option value="Shampoo">Shampoo</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Harga</td>
                <td>:</td>
                <td><input type="number" id="harga" readonly></td>
            </tr>
            <tr>
                <td>Jumlah</td>
                <td>:</td>
                <td><input type="number" id="jumlah"></td>
            </tr>
            <tr>
                <td colspan="3">
                    <hr class="garis-tengah">
                </td>
            </tr>
            <tr>
                <td>Total</td>
                <td>:</td>
                <td><input type="text" id="total" readonly></td>
            </tr>
            <tr>
                <td>Diskon</td>
                <td>:</td>
                <td><input type="text" id="diskon" readonly></td>
            </tr>
            <tr>
                <td>Bayar</td>
                <td>:</td>
                <td><input type="text" id="bayar" readonly></td>
            </tr>
            <tr>
                <td colspan="3">
                    <hr>
                </td>
            </tr>
            <tr>
                <td colspan="3">
                    <input type="button" value="Proses" onclick="proses()" class="btn">
                    <input type="reset" class="btn">
                </td>
            </tr>
        </table>
    </form>

    <script src="script.js"></script>
</body>

</html>
